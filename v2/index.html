<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معنایاب نام فارسی — انتقال به آدرس اصلی</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://kourosh242.github.io/Persian-name-finder/">
<meta http-equiv="refresh" content="0; url=../">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.20/index.css">
<style>
:root{
  --card:rgba(14,20,48,.88); --line:rgba(232,193,90,.22); --line2:rgba(232,193,90,.45);
  --gold:#e8c15a; --gold2:#f6e2a0; --copper:#d99a5b; --txt:#eef1ff; --mut:#9aa3c7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;color:var(--txt);min-height:100vh;
  display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(55% 38% at 50% 0%, rgba(232,193,90,.10), transparent 60%),
    linear-gradient(180deg,#0a1030 0%, #070b1c 55%, #060a18 100%);
}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;max-width:520px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.38)}
.moon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;margin:0 auto 16px;background:radial-gradient(circle at 32% 30%, #fff8dc, var(--gold) 55%, #8a6a1e);box-shadow:0 0 22px rgba(232,193,90,.4)}
h1{font-size:1.3rem;font-weight:900;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--copper));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
p{color:var(--mut);line-height:2.1;font-size:.92rem}
a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:13px 24px;border-radius:14px;text-decoration:none;font-weight:800;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--copper));color:#241a05}
code{direction:ltr;display:inline-block;background:rgba(232,193,90,.1);border:1px solid var(--line);color:var(--gold2);border-radius:8px;padding:2px 8px;font-size:.8rem}
</style>
</head>
<body>
<div class="box">
  <div class="moon">🌙</div>
  <h1>معنایاب نام فارسی از این پس روی آدرس اصلی است</h1>
  <p>
    اپ همیشه روی یک آدرس ثابت منتشر می‌شود و همان‌جا به‌روزترین نسخه را می‌بینید:
    <br><code>kourosh242.github.io/Persian-name-finder</code>
    <br>در حال انتقال…
  </p>
  <a class="btn" href="../">🚀 رفتن به اپ</a>
</div>
<script>location.replace('../');</script>
</body>
</html>
