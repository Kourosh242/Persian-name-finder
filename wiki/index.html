{id:"search-engine",icon:"🔎",title:"موتور جستجو",html:`
<h1>🔎 موتور جستجو</h1>
<p>موتور جستجو کاملاً <b>سمت-کلاینت</b> است و از سه لایه تشکیل شده:</p>
<pre><code>ورودی کاربر
   │
   ▼
① normalize()                  ← یکسان‌سازی حروف فارسی/عربی
   │
   ▼
② searchDB() / fuzzySuggest()  ← امتیازدهی ۶سطحی + Levenshtein
   │
   ▼
③ rootAnalysis()               ← تحلیل ریشهٔ نام‌های ناشناخته</code></pre>

<h2>① نرمال‌سازی (normalize)</h2>
<p>قبل از هر مقایسه، ورودی کاربر و نام‌های پایگاه یکدست می‌شوند: «ي» ⟵ «ی»، «ك» ⟵ «ک»، حذف اعراب (U+064B–065F)، نیم‌فاصله (ZWNJ) و فاصله‌های تکراری.</p>
<pre><code>function normalize(s){
  return String(s??"").toLowerCase()
    .replace(/ي/g,'ی').replace(/ك/g,'ک')   // ي عربی → ی فارسی
    .replace(/ة/g,'ه')
    .replace(/[أإآٱ]/g,'ا')                // همزه‌ها → ا
    .replace(/ؤ/g,'و').replace(/ئ/g,'ی')
    .replace(/[\\u200c\\u200f\\u200e\\u064b-\\u065f\\u0670]/g,'')
    .replace(/\\s+/g,' ').trim();
}</code></pre>
<div class="note">نتیجه: «كوروش»، «کورُوش» و «کوروش» هر سه یکسان درک می‌شوند.</div>

<h2>② امتیازدهی ۶سطحی (searchDB)</h2>
<table>
<tr><th>#</th><th>شرط</th><th>امتیاز</th></tr>

<tr><td>۲</td><td>نام با پرس‌وجو شروع شود (پیشوند)</td><td><span class="tag tg-ok">۸۵ − طول</span></td></tr>
<tr><td>۳</td><td>املاهای جایگزین پیشوند باشند</td><td><span class="tag tg-ok">۷۰</span></td></tr>
<tr><td>۴</td><td>نام شامل پرس‌وجو باشد</td><td><span class="tag tg-ok">۶۰</span></td></tr>
<tr><td>۵</td><td>فاصلهٔ Levenshtein ≤ ⌊طول/۴⌋</td><td><span class="tag tg-g">۴۵ − ۱۰×فاصله</span></td></tr>
<tr><td>۶</td><td>پرس‌وجو در معنی یا توضیح باشد</td><td><span class="tag tg-p">۲۵</span></td></tr>
</table>
<p>نتایج بر اساس امتیاز نزولی و سپس ترتیب الفبایی فارسی مرتب و <b>۶ نتیجهٔ برتر</b> نمایش داده می‌شوند. برای پیشنهاد زنده، <code>fuzzySuggest</code> با فاصلهٔ حداکثر ۳ نزدیک‌ترین نام‌ها را می‌دهد.</p>

<h2>③ فاصلهٔ Levenshtein</h2>
<p>پیاده‌سازی کلاسیک فاصلهٔ ویرایشی با پیچیدگی <code>O(m×n)</code> و حافظهٔ <code>O(n)</code> (فقط دو ردیف — بهینه برای موبایل):</p>
<pre><code>function lev(a,b){
  const m=a.length, n=b.length;
  if(!m) return n;  if(!n) return m;
  let prev = Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i&lt;=m;i++){
    const cur=[i];
    for(let j=1;j&lt;=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1,
                      prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}</code></pre>
<div class="note gold">✨ <b>مثال واقعی:</b> «کورش» ⟶ فاصلهٔ ۱ از «کوروش» ⟶ امتیاز ۳۵ ⟶ به‌عنوان نزدیک‌ترین نتیجه پیشنهاد می‌شود.</div>

<h2>④ تحلیل ریشه (rootAnalysis)</h2>
<table>
<tr><th>الگو در نام</th><th>تشخیص</th></tr>
<tr><td>حروف لاتین</td><td>لاتین / اروپایی</td></tr>
<tr><td>داشتن «پ چ ژ گ»</td><td>فارسی</td></tr>
<tr><td>پیشوند «ال / عبد» یا حروف «ث ذ ص ض ط ظ ع غ ح»</td><td>عربی</td></tr>
<tr><td>پسوند «مهر فر زاد بانو دخت وند یار ناز دیس گین»</td><td>فارسی</td></tr>
<tr><td>پیشوند «مهـ آذر کی خو»</td><td>فارسی باستان</td></tr>
<tr><td>سایر</td><td>احتمالاً فارسی یا عربی</td></tr>
</table>

<h2>بهینه‌سازی‌های UX</h2>
<ul>
<li><b>Debounce:</b> ۱۰۰ms برای پیشنهاد زنده و ۹۰ms برای فیلتر مودال</li>
<li><b>کیبورد کامل:</b> ↑ ↓ Enter Esc در پیشنهادها</li>
<li>مرتب‌سازی ثانویه با <code>localeCompare('fa')</code> برای ترتیب الفبای درست فارسی</li>
</ul>
`},

{id:"wikipedia",icon:"🌐",title:"ویکی‌پدیا",html:`
<h1>🌐 یکپارچه‌سازی ویکی‌پدیا</h1>
<p>نسخهٔ ۲ علاوه بر پایگاه محلی، برای هر نام به‌صورت زنده خلاصهٔ ویکی‌پدیا را می‌گیرد و در «کارت ویکی» نمایش می‌دهد.</p>

<h2>API های استفاده‌شده</h2>
<table>
<tr><th>API</th><th>کاربرد</th></tr>
<tr><td><code>action=opensearch</code></td><td>پیدا کردن عنوان دقیق مقاله (محدود به ۳ نتیجه، namespace 0، با origin=* برای CORS)</td></tr>
<tr><td><code>api/rest_v1/page/summary</code></td><td>خلاصه، عکس و لینک مقاله</td></tr>
</table>

<h2>جریان fallback دو مرحله‌ای</h2>
<pre><code>نام پیدا شد در پایگاه محلی
   │
   ▼
① opensearch در ویکی‌پدیای «فارسی» ── پیداشد ──▶ summary فارسی ✅
   │ نبود
   ▼
② opensearch در ویکی‌پدیای «انگلیسی»
   (با آوانگاری لاتین) ── پیداشد ──▶ summary انگلیسی ✅
   │ نبود
   ▼
کارت «مقاله‌ای یافت نشد» + دکمهٔ تلاش مجدد ↻</code></pre>

<h2>مهندسی مدیریت درخواست‌ها ⚙️</h2>
<h3>۱. مهلت ۸ ثانیه‌ای (fetchT)</h3>
<p>هر درخواست با <code>AbortController</code> و <code>setTimeout</code> احاطه شده؛ اگر ویکی‌پدیا دیر جواب داد، درخواست لغو و <code>null</code> برگردانده می‌شود — رابط کاربری هرگز قفل نمی‌شود.</p>
<h3>۲. لغو درخواست‌های قدیمی (wikiCtrl)</h3>
<p>با هر جستجوی جدید، درخواست قبلی <code>abort()</code> می‌شود؛ جستجوهای سریع پشت‌سرهم فقط <b>آخرین</b> درخواست را زنده نگه می‌دارند (حل مشکل race condition).</p>
<h3>۳. نگهبان نسل جستجو (searchGen)</h3>
<p>هر جستجو یک شناسهٔ نسل دارد؛ پاسخ‌ها فقط وقتی رندر می‌شوند که متعلق به جدیدترین نسل باشند.</p>

<h2>بخش‌های مرتبط در UI</h2>
<ul>
<li>🖼 کارت ویکی: عکس، عنوان، خلاصه و لینک «مشاهدهٔ کامل»</li>
<li>🌟 چهره‌های مشهور: هر چهره به جستجوی ویکی‌پدیای فارسی لینک است</li>
<li>🔗 کارت لینک‌های بیرونی برای هر نام</li>
</ul>
`},

{id:"database",icon:"📚",title:"پایگاه دادهٔ نام‌ها",html:`
<h1>📚 پایگاه دادهٔ نام‌ها</h1>
<p>پایگاه داده، آرایه‌ای جاوااسکریپتی به نام <code>NAMES</code> در فایل <code>Persian-name-founder-v2.html</code> است که <b>۱۰۰ نام</b> را در بر می‌گیرد.</p>

<h2>ساختار رکورد</h2>
<pre><code>{
  n: "کوروش",                  // نام (یکتا)
  v: ["کورش"],                 // املاهای جایگزین
  p: "Kourosh",                // آوانگاری لاتین
  g: "پسر",                    // پسر | دختر | مشترک
  r: "فارسی باستان",           // ریشه / خاستگاه
  m: "خورشید؛ بنیان‌گذار شاهنشاهی هخامنشی", // معنی
  d: "کوروش بزرگ بنیان‌گذار نخستین…",        // توضیح
  f: ["کوروش بزرگ (کوروش دوم هخامنشی)"]     // مشاهیر
}</code></pre>
<table>
<tr><th>فیلد</th><th>نقش</th></tr>
<tr><td><code>n</code></td><td>نام اصلی — یکتا</td></tr>
<tr><td><code>v</code></td><td>املاهای رایج؛ در جستجو امتیاز کامل می‌گیرند</td></tr>
<tr><td><code>p</code></td><td>آوانگاری لاتین؛ برای fallback ویکی‌پدیای انگلیسی</td></tr>
<tr><td><code>g</code></td><td>جنسیت: 🌊 پسر · 🌸 دختر · ✨ مشترک</td></tr>
<tr><td><code>r</code></td><td>ریشه: فارسی باستان، پهلوی، اوستایی، پارتی، فارسی، عربی…</td></tr>
<tr><td><code>m</code></td><td>معنی کوتاه (قابل کپی با 📋)</td></tr>
<tr><td><code>d</code></td><td>توضیح بلندتر: داستان، تاریخ یا ادبیات</td></tr>
<tr><td><code>f</code></td><td>چهره‌های مشهور؛ هر مورد به ویکی‌پدیا لینک می‌شود</td></tr>
</table>

<h2>✅ افزودن نام جدید</h2>
<ol>
<li>فایل <code>Persian-name-founder-v2.html</code> را باز کنید و آرایهٔ <code>NAMES</code> را پیدا کنید.</li>
<li>رکورد کامل جدیدی به آرایه اضافه کنید:</li>
</ol>
<pre><code>{n:"بهنام",p:"Behnam",g:"پسر",r:"فارسی",m:"نام نیک، دارای نشان نیک",
 d:"نامی کهن به معنای کسی که نامش نیکوست.",
 f:["بهنام صفوی — خواننده"]},</code></pre>
<div class="note">شمارندهٔ «📚 X نام در پایگاه محلی» بالای اپ، خودکار به‌روز می‌شود. در PR حتماً <code>v2/index.html</code> را هم با سورس هم‌گام کنید.</div>
<h2>قواعد مشارکت</h2>
<ul>
<li>حداقل فیلدهای <code>n · p · g · r · m</code> الزامی است</li>
<li>معنی‌ها از منابع معتبر و با لحن ساده و محترمانه</li>
<li>در <code>f</code> فقط افراد مشهور قابل راستی‌آزمایی در ویکی‌پدیا</li>
</ul>
`},

{id:"faq",icon:"❓",title:"سوالات متداول",html:`
<h1>❓ سوالات متداول</h1>
<h3>۱. چطور از اپ استفاده کنم؟</h3>
<p>به <a href="https://kourosh242.github.io/Persian-name-finder/v2/" target="_blank" rel="noopener">نسخهٔ ۲</a> بروید، نام را تایپ و Enter بزنید — بدون نصب و ثبت‌نام.</p>
<h3>۲. اگر نام را غرق بنویسم چه می‌شود؟ 😅</h3>
<p>مشکلی نیست! موتور جستجو با الگوریتم Levenshtein تا ~۲۵٪ خطای املایی را تحمل می‌کند؛ «کورش» و «آراشِ» هم پیدایشان می‌کند. اگر چیزی پیدا نشد، نزدیک‌ترین نام‌ها پیشنهاد می‌شوند.</p>
<h3>۳. حروف عربی و فارسی قاطی می‌شوند؟</h3>
<p>نه — تابع normalize خودکار «ي/ی» و «ك/ک» را یکسان می‌کند و اعراب و نیم‌فاصله را حذف می‌کند.</p>
<h3>۴. اطلاعات از کجا می‌آید؟</h3>
<p>دو منبع: <b>پایگاه محلی ۱۰۰ نام</b> (دستی گردآوری) و <b>ویکی‌پدیای فا/ان</b> (خلاصهٔ زنده از API رسمی).</p>
<h3>۵. آیا اپ آفلاین کار می‌کند؟</h3>
<p>جستجوی پایگاه محلی بله؛ برای ویکی‌پدیا اینترنت لازم است. نسخهٔ ۱ یک PWA کامل با کش آفلاین است.</p>
<h3>۶. چرا نسخهٔ ۲ PWA نیست؟</h3>
<p>عمداً تک‌فایل و سبک طراحی شده تا هرجا خواستید کپی/اجرا کنید. افزودن PWA به v2 در نقشهٔ راه است.</p>
<h3>۷. چطور نام جدید اضافه کنم؟</h3>
<p>راهنمای کامل در صفحهٔ «پایگاه دادهٔ نام‌ها» — به آرایهٔ NAMES اضافه و PR بفرستید.</p>
<h3>۸. آیا داده‌های من ذخیره می‌شود؟</h3>
<p>خیر؛ همه‌چیز در مرورگر خودتان اجرا می‌شود و تنها درخواست بیرونی، ویکی‌پدیا است.</p>
<h3>۹. فونت لود نمی‌شود؟</h3>
<p>فونت وزیرمتن از CDN لود می‌شود؛ در صورت محدودیت شبکه، فونت جایگزین (Tahoma) استفاده و اپ همچنان کار می‌کند.</p>
<h3>۱۰. دامنهٔ اختصاصی؟</h3>
<p>GitHub Pages از Custom Domain پشتیبانی می‌کند — در تنظیمات Pages مخزن فعال کنید.</p>
`},

/* ================= رندر و ناوبری ================= */
const nav=$('#nav'),content=$('#content'),searchBox=$('#wikiSearch');
function $(s){return document.querySelector(s);}
const byId=id=>ARTICLES.find(a=>a.id===id)||ARTICLES[0];

function renderNav(filter){
  const f=(filter||'').trim().toLowerCase();
  const list=f?ARTICLES.filter(a=>(a.title+a.html).toLowerCase().includes(f)):ARTICLES;
  nav.innerHTML=list.length
    ? list.map(a=>`<a href="#/${a.id}" data-id="${a.id}">${a.icon} ${a.title}</a>`).join('')
    : `<div class="nores">📄 چیزی یافت نشد — عبارت دیگری امتحان کنید</div>`;
  paintActive();
}
function paintActive(){
  const id=location.hash.replace('#/','')||'home';
  [...nav.children].forEach(el=>el.classList&&el.classList.toggle('on',el.dataset.id===id));
}
function render(){
  const id=location.hash.replace('#/','')||'home';
  const a=byId(id);
  content.innerHTML=`<div class="article">${a.html}</div>
  <a class="back" href="#/home">🏠 بازگشت به خانهٔ ویکی</a>`;
  window.scrollTo({top:0,behavior:'auto'});
  paintActive();
}
window.addEventListener('hashchange',render);
let t;searchBox.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>renderNav(searchBox.value),80);});
nav.addEventListener('click',e=>{if(e.target.closest('a'))searchBox.value='',renderNav('');});
renderNav('');render();
</script>
